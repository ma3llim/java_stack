version: "3.9"

services:
  app:
    build: .
    container_name: product-catelog

    ports:
      - "8080:8080"

    env_file:
      - .env.docker

    depends_on:
      - mysql
      - redis

    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: mysql

    ports:
      - "3306:3306"

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

volumes:
  mysql_data:
  redis_data: