app:
  # pagination configs
  pagination:
    max-size: 20
    default-size: 10

  service:
    name: product-catalog
    version: 1.0.0

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger
    url: /api-docs

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    access-ttl-seconds: ${ACCESS_TTL_SECONDS}
    refresh-ttl-seconds: ${REFRESH_TTL_SECONDS}