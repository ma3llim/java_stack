spring:
  application:
    name: products
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:products}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  pagination:
    max-size: 20
    default-size: 10

  service:
    name: product-catalog
    version: 1.0.0

  jwt:
    secret: ${JWT_SECRET:my-default-secret-key-at-least-32-characters-long}
    issuer: ${JWT_ISSUER:product-catalog-app}
    access-ttl-seconds: ${ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${REFRESH_TTL_SECONDS:86400}

  cors:
    allowed-origins: http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
    allowed-headers:
      - "*"
    allowed-credentials: true
    max-age: 3600

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
    url: /api-docs