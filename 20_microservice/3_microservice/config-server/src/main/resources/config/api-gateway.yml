server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**

            - id: category-service
              uri: lb://CATEGORY-SERVICE
              predicates:
                - Path=/api/v1/categories/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka