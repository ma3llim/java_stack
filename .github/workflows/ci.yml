name: Product Catalog CI

on:
    push:
        branches:
            - deployment

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: 07_spring/product_catelog

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Java 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Give Gradlew Permission
              run: chmod +x gradlew

            - name: Run Tests With Coverage
              run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

            - name: Upload Coverage Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: jacoco-report
                  path: 07_spring/product_catelog/app/build/reports/jacoco/test/html

            - name: SonarQube Analysis
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: ./gradlew sonar --no-configuration-cache

            - name: OWASP Dependency Check
              env:
                  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
              run: ./gradlew dependencyCheckAnalyze --no-configuration-cache

            - name: Upload Dependency Check Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: dependency-check-report
                  path: 07_spring/product_catelog/app/build/reports/dependency-check-report.html

            - name: Login To Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Build Docker Image
              run: docker build -t ${{ secrets.DOCKER_USERNAME }}/product-catelog:latest .

            - name: Push Docker Image
              run: docker push ${{ secrets.DOCKER_USERNAME }}/product-catelog:latest
