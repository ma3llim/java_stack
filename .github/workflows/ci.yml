name: Product Catalog CI

on:
  push:
    branches:
      - deployment

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 07_spring/product_catelog

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give Gradlew Permission
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build Docker Image
        run: docker build -t product-catelog:latest .

      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ma3llim007/product-catelog:latest 07_spring/product_catelog

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/product-catelog:latest