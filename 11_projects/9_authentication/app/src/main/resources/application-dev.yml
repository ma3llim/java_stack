spring:
  application:
    name: authenication
  datasource:
    url: jdbc:mysql://localhost:3306/auth_app
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS}

  cookie:
    name: ${JWT_COOKIE_NAME}
    secure: ${JWT_COOKIE_SECURE}
    http-only: ${JWT_COOKIE_HTTP_ONLY}
    same-site: ${JWT_COOKIE_SAME_SITE}
    domain: ${JWT_COOKIE_DOMAIN}